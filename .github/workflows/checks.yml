name: Roomly checks
on:
  push:
    branches: [main, work]
  pull_request:
permissions:
  contents: read
jobs:
  backend-and-image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -m unittest discover -s tests -v
      - run: node --check public/app.js
      - run: docker build -t roomly:ci .

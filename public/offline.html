<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#14765b">
  <title>Roomly · Mất kết nối</title>
  <style>
    *{box-sizing:border-box}body{margin:0;min-height:100dvh;padding:24px;background:#f7f8fa;color:#203e32;display:grid;place-items:center;font-family:system-ui,sans-serif}main{max-width:420px;text-align:center;background:white;border-radius:24px;padding:36px 26px}img{width:72px;border-radius:18px}h1{font-size:24px}p{line-height:1.7;color:#65776c}button{background:#14765b;color:white;border:0;border-radius:12px;padding:15px 24px;font:inherit;cursor:pointer}
  </style>
</head>
<body>
  <main>
    <img src="/icons/icon-192.png" alt="Roomly">
    <h1>Chưa có kết nối Internet</h1>
    <p>Kết nối Wi-Fi hoặc dữ liệu di động để xem hóa đơn và quản lý phòng. Roomly sẽ tải dữ liệu mới từ máy chủ khi có mạng.</p>
    <button id="retry">Thử lại</button>
  </main>
  <script>document.querySelector('#retry').onclick=()=>location.reload();window.addEventListener('online',()=>location.reload());</script>
</body>
</html>
